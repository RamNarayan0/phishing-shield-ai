<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; min-height: 180px; padding: 16px; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    button:hover { background: #2563eb; }
    .status { margin-top: 8px; font-size: 12px; color: #94a3b8; line-height: 1.5; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; margin-bottom: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 13px; }
    input::placeholder { color: #64748b; }
    h3 { margin: 0 0 4px 0; color: #f8fafc; font-size: 16px; }
    p { margin: 0 0 10px 0; }
  </style>
</head>
<body>
  <h3>🛡️ Phishing Shield AI</h3>
  <p style="font-size: 11px; color: #94a3b8;">Highlight a suspicious message, enter sender details, then scan.</p>
  <input type="text" id="senderId" placeholder="📧 Sender Email or 📱 Phone Number (Optional)" />
  <button id="scanBtn">🔍 Scan Selected Message</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
