<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; min-height: 200px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b1120; color: #e2e8f0; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #1e293b; color: #38bdf8; border: 1px solid #334155; }
    h3 { margin: 0; color: #f8fafc; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
    p { margin: 0 0 10px 0; font-size: 11px; color: #94a3b8; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 8px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 12px; }
    input::placeholder { color: #64748b; }
    button { width: 100%; padding: 9px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 10px; font-size: 12px; color: #94a3b8; line-height: 1.4; }
    .settings-toggle { font-size: 10px; color: #64748b; cursor: pointer; text-align: right; margin-top: 4px; }
    .settings-toggle:hover { color: #94a3b8; }
    .settings-panel { display: none; background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 8px; margin-top: 6px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <h3>🛡️ Phishing Shield AI</h3>
    <span id="envBadge" class="badge">Cloud AI</span>
  </div>
  <p>Highlight any message or email text with your mouse, then click scan.</p>
  
  <input type="text" id="senderId" placeholder="📧 Sender Email / 📱 Phone Number (Optional)" />
  <button id="scanBtn">🔍 Scan Selected Message</button>
  
  <div class="settings-toggle" id="toggleSettings">⚙️ Backend Settings</div>
  <div class="settings-panel" id="settingsPanel">
    <label style="display:block; margin-bottom:4px; font-weight:bold; color:#cbd5e1;">Backend API Mode:</label>
    <select id="apiMode">
      <option value="auto">Auto (Local first, then Cloud Render)</option>
      <option value="https://phishing-shield-ai-backend.onrender.com">Cloud Render Production</option>
      <option value="http://127.0.0.1:8000">Local Dev Server (127.0.0.1:8000)</option>
    </select>
  </div>

  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
