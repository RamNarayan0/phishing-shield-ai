services:
  - type: web
    name: phishing-shield-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: phishing_shield_ai
      - key: MONGODB_COLLECTION
        value: analysis_history
      - key: MAX_REQUEST_SIZE_BYTES
        value: "262144"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ramnarayan0.github.io,https://phishing-shield-ai.vercel.app,https://phishing-shield-ai-frontend.onrender.com

  - type: web
    name: phishing-shield-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://phishing-shield-ai-backend.onrender.com
